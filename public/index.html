<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prein AI</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: #12121f;
      border-right: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      transition: margin-left 0.3s ease, width 0.3s ease;
      flex-shrink: 0;
    }

    .sidebar.collapsed {
      margin-left: -260px;
    }

    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header h2 {
      font-size: 1.125rem;
      font-weight: 600;
      color: #e94560;
    }

    .sidebar-toggle {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .sidebar-toggle:hover {
      color: #eee;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .nav-section {
      margin-bottom: 1rem;
    }

    .nav-section-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.5rem 0.75rem;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 0.75rem;
      color: #aaa;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.875rem;
      transition: background-color 0.2s, color 0.2s;
    }

    .nav-link:hover {
      background-color: #1a1a2e;
      color: #eee;
    }

    .nav-link.active {
      background-color: #0f3460;
      color: #eee;
    }

    .nav-link svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 1rem;
      border-top: 1px solid #0f3460;
      font-size: 0.75rem;
      color: #666;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .header {
      background-color: #16213e;
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid #0f3460;
    }

    .menu-toggle {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .menu-toggle:hover {
      color: #eee;
    }

    .header-title {
      flex: 1;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .clear-btn {
      background-color: #e94560;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background-color 0.2s;
    }

    .clear-btn:hover {
      background-color: #c73e54;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 80%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      line-height: 1.5;
    }

    .user-message {
      background-color: #0f3460;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .assistant-message {
      background-color: #16213e;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .error-message {
      background-color: #4a1a1a;
      color: #ff6b6b;
      align-self: center;
    }

    .message-content {
      word-wrap: break-word;
    }

    .message-content pre {
      background-color: #0a0a14;
      padding: 0.75rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 0.5rem 0;
    }

    .message-content code {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 0.875rem;
    }

    .message-content code:not(pre code) {
      background-color: #0a0a14;
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
    }

    .input-container {
      padding: 1rem;
      background-color: #16213e;
      border-top: 1px solid #0f3460;
    }

    .input-form {
      display: flex;
      gap: 0.75rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .message-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #0f3460;
      border-radius: 8px;
      background-color: #1a1a2e;
      color: #eee;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .message-input:focus {
      border-color: #e94560;
    }

    .message-input::placeholder {
      color: #666;
    }

    .send-btn {
      background-color: #e94560;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .send-btn:hover {
      background-color: #c73e54;
    }

    .send-btn:disabled {
      background-color: #555;
      cursor: not-allowed;
    }

    .htmx-request .send-btn {
      background-color: #555;
    }

    .htmx-request .send-btn::after {
      content: '...';
    }

    .welcome-message {
      text-align: center;
      color: #666;
      margin-top: 2rem;
    }

    .welcome-message h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #888;
    }

    .welcome-message p {
      font-size: 0.875rem;
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 100;
      }

      .sidebar.collapsed {
        margin-left: -260px;
      }

      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 99;
      }

      .sidebar-overlay.visible {
        display: block;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar Overlay for mobile -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>Prein AI</h2>
      <button class="sidebar-toggle" onclick="toggleSidebar()" title="Close sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">Main</div>
        <a href="/" class="nav-link active">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          Chat
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-section-title">Features</div>
        <a href="/prompts" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          Prompts
        </a>
        <a href="/agents" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 8V4H8"/>
            <rect width="16" height="12" x="4" y="8" rx="2"/>
            <path d="M2 14h2"/>
            <path d="M20 14h2"/>
            <path d="M15 13v2"/>
            <path d="M9 13v2"/>
          </svg>
          Agents
        </a>
        <a href="/tools" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
          Tools
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-section-title">Settings</div>
        <a href="/settings" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          Settings
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      Prein AI v0.1.0
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="header">
      <button class="menu-toggle" onclick="toggleSidebar()" title="Toggle sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="20" y1="12" y2="12"/>
          <line x1="4" x2="20" y1="6" y2="6"/>
          <line x1="4" x2="20" y1="18" y2="18"/>
        </svg>
      </button>
      <div class="header-title">
        <h1>Chat</h1>
      </div>
      <button
        class="clear-btn"
        hx-post="/api/clear"
        hx-swap="none"
        onclick="document.getElementById('chat-messages').innerHTML = '<div class=\'welcome-message\'><h2>Chat Cleared</h2><p>Start a new conversation</p></div>'"
      >
        Clear Chat
      </button>
    </header>

    <div id="chat-messages" class="chat-container">
      <div class="welcome-message">
        <h2>Welcome to Prein AI</h2>
        <p>Send a message to start the conversation</p>
      </div>
    </div>

    <div class="input-container">
      <form
        class="input-form"
        hx-post="/api/chat"
        hx-target="#chat-messages"
        hx-swap="beforeend"
        hx-on::before-request="clearWelcome()"
        hx-on::after-request="this.reset(); scrollToBottom();"
      >
        <input
          type="text"
          name="message"
          class="message-input"
          placeholder="Type your message..."
          autocomplete="off"
          required
        >
        <button type="submit" class="send-btn">Send</button>
      </form>
    </div>
  </main>

  <script>
    // Sidebar toggle
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('collapsed');
      overlay.classList.toggle('visible');

      // Save preference
      localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
    }

    // Restore sidebar state on load
    document.addEventListener('DOMContentLoaded', () => {
      const collapsed = localStorage.getItem('sidebarCollapsed') === 'true';
      if (collapsed) {
        document.getElementById('sidebar').classList.add('collapsed');
      }
    });

    // Convert form data to JSON for the API
    document.body.addEventListener('htmx:configRequest', (event) => {
      if (event.detail.path === '/api/chat') {
        const formData = event.detail.parameters;
        event.detail.headers['Content-Type'] = 'application/json';
        event.detail.parameters = {};
        event.detail.unfilteredParameters = {};
        event.detail.requestBody = JSON.stringify({ message: formData.message });
      }
    });

    // Use the custom request body
    document.body.addEventListener('htmx:beforeRequest', (event) => {
      if (event.detail.requestConfig.path === '/api/chat' && event.detail.requestConfig.requestBody) {
        const xhr = event.detail.xhr;
        xhr.send = function(original) {
          return function(body) {
            original.call(this, event.detail.requestConfig.requestBody);
          };
        }(xhr.send);
      }
    });

    function clearWelcome() {
      const welcome = document.querySelector('.welcome-message');
      if (welcome) {
        welcome.remove();
      }
    }

    function scrollToBottom() {
      const container = document.getElementById('chat-messages');
      container.scrollTop = container.scrollHeight;
    }

    // Auto-scroll on new messages
    const observer = new MutationObserver(scrollToBottom);
    observer.observe(document.getElementById('chat-messages'), { childList: true });
  </script>
</body>
</html>
