<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background-color: #16213e;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #0f3460;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .clear-btn {
      background-color: #e94560;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background-color 0.2s;
    }

    .clear-btn:hover {
      background-color: #c73e54;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 80%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      line-height: 1.5;
    }

    .user-message {
      background-color: #0f3460;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .assistant-message {
      background-color: #16213e;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .error-message {
      background-color: #4a1a1a;
      color: #ff6b6b;
      align-self: center;
    }

    .message-content {
      word-wrap: break-word;
    }

    .message-content pre {
      background-color: #0a0a14;
      padding: 0.75rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 0.5rem 0;
    }

    .message-content code {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 0.875rem;
    }

    .message-content code:not(pre code) {
      background-color: #0a0a14;
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
    }

    .input-container {
      padding: 1rem;
      background-color: #16213e;
      border-top: 1px solid #0f3460;
    }

    .input-form {
      display: flex;
      gap: 0.75rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .message-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #0f3460;
      border-radius: 8px;
      background-color: #1a1a2e;
      color: #eee;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .message-input:focus {
      border-color: #e94560;
    }

    .message-input::placeholder {
      color: #666;
    }

    .send-btn {
      background-color: #e94560;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .send-btn:hover {
      background-color: #c73e54;
    }

    .send-btn:disabled {
      background-color: #555;
      cursor: not-allowed;
    }

    .htmx-request .send-btn {
      background-color: #555;
    }

    .htmx-request .send-btn::after {
      content: '...';
    }

    .loading-indicator {
      display: none;
      align-self: flex-start;
      padding: 0.75rem 1rem;
      background-color: #16213e;
      border-radius: 12px;
      color: #888;
    }

    .htmx-request ~ .loading-indicator {
      display: block;
    }

    .welcome-message {
      text-align: center;
      color: #666;
      margin-top: 2rem;
    }

    .welcome-message h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #888;
    }

    .welcome-message p {
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>AI Chat</h1>
    <button
      class="clear-btn"
      hx-post="/api/clear"
      hx-swap="none"
      onclick="document.getElementById('chat-messages').innerHTML = '<div class=\'welcome-message\'><h2>Chat Cleared</h2><p>Start a new conversation</p></div>'"
    >
      Clear Chat
    </button>
  </header>

  <div id="chat-messages" class="chat-container">
    <div class="welcome-message">
      <h2>Welcome to AI Chat</h2>
      <p>Send a message to start the conversation</p>
    </div>
  </div>

  <div class="input-container">
    <form
      class="input-form"
      hx-post="/api/chat"
      hx-target="#chat-messages"
      hx-swap="beforeend"
      hx-on::before-request="clearWelcome()"
      hx-on::after-request="this.reset(); scrollToBottom();"
    >
      <input
        type="text"
        name="message"
        class="message-input"
        placeholder="Type your message..."
        autocomplete="off"
        required
      >
      <button type="submit" class="send-btn">Send</button>
    </form>
  </div>

  <script>
    // Convert form data to JSON for the API
    document.body.addEventListener('htmx:configRequest', (event) => {
      if (event.detail.path === '/api/chat') {
        const formData = event.detail.parameters;
        event.detail.headers['Content-Type'] = 'application/json';
        event.detail.parameters = {};
        event.detail.unfilteredParameters = {};
        // Store the JSON body
        event.detail.requestBody = JSON.stringify({ message: formData.message });
      }
    });

    // Use the custom request body
    document.body.addEventListener('htmx:beforeRequest', (event) => {
      if (event.detail.requestConfig.path === '/api/chat' && event.detail.requestConfig.requestBody) {
        const xhr = event.detail.xhr;
        xhr.send = function(original) {
          return function(body) {
            original.call(this, event.detail.requestConfig.requestBody);
          };
        }(xhr.send);
      }
    });

    function clearWelcome() {
      const welcome = document.querySelector('.welcome-message');
      if (welcome) {
        welcome.remove();
      }
    }

    function scrollToBottom() {
      const container = document.getElementById('chat-messages');
      container.scrollTop = container.scrollHeight;
    }

    // Auto-scroll on new messages
    const observer = new MutationObserver(scrollToBottom);
    observer.observe(document.getElementById('chat-messages'), { childList: true });
  </script>
</body>
</html>
